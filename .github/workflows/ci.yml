name: CI

# Runs on every push and pull request. A push gate that has to be asked for by
# hand is not a gate: it verifies whatever someone remembered to ask about.
# `bin/ci` is the local gate and a fast one, but it runs on the machine that
# wrote the code — this is the clean machine that has never seen it.
on:
  pull_request:
  push:
    branches: [ master ]
  # Kept so `bin/ci --remote` can still ask for a run on demand. It is an
  # addition to the push trigger, never a replacement for it.
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        default: all
        options: [all, linux]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # `test -z "$(gofmt -l .)"` reads as a pass when gofmt never ran at all:
      # the command substitution swallows the failure and returns empty. Check
      # the exit status, and print the files so a failure says which ones.
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .) || exit 1
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
