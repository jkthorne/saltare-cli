# goreleaser config for sal. Local dry run:
#   goreleaser release --snapshot --clean
version: 2

project_name: sal

builds:
  - id: sal
    main: ./cmd/sal
    binary: sal
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: sal
    formats: [tar.gz]
    name_template: "sal_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    include:
      - "^feat"
      - "^fix"

# Homebrew tap publishing — intentionally disabled while this repo is
# PRIVATE: goreleaser writes formulas with public release-asset URLs, which
# brew's fetcher can't download from a private repo. The live tap
# (jkthorne/homebrew-tap) instead carries a hand-maintained build-from-source
# formula over SSH; bump its tag/version per release. Uncomment this (and set
# the HOMEBREW_TAP_TOKEN secret, a PAT with repo scope) when the repo goes
# public.
#
# brews:
#   - name: sal
#     repository:
#       owner: jkthorne
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
